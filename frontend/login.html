<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Grocery Store</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🛒 GroceryMart</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
            </ul>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <p class="auth-link">Don't have an account? <a href="signup.html">Sign up</a></p>
            <p class="auth-link"><a href="admin-login.html">Admin Login</a></p>
            <div id="error-message" class="error-message"></div>
        </div>
    </div>

    <script src="js/config.js?v=FINAL_FIX"></script>
    <script src="js/auth.js?v=FINAL_FIX"></script>
    <script src="js/api.js?v=FINAL_FIX"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-message');

            try {
                errorEl.textContent = 'Connecting...';
                const { response, data } = await apiRequest('/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    errorEl.textContent = data.message || 'Login failed';
                }
            } catch (error) {
                console.error('Login Error:', error);
                errorEl.innerHTML = `<b>Connection Error</b><br><small>Failed to reach: ${API_BASE_URL}/login</small><br><small>Check F12 Console for details.</small>`;
            }
        });
    </script>
</body>

</html>
