apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      - name: init-admin-fix
        image: kumaresan05/grocery-backend:latest
        command: ["node", "-e", "const mongoose = require('mongoose'); const Admin = require('./models/Admin'); const bcrypt = require('bcryptjs'); mongoose.connect(process.env.MONGODB_URI).then(async () => { const hash = await bcrypt.hash('admin123', 10); await Admin.findOneAndUpdate({ email: 'admin@grocerymart.com' }, { name: 'Admin', email: 'admin@grocerymart.com', password: hash }, { upsert: true }); await Admin.findOneAndUpdate({ email: 'admin@grocerystore.com' }, { name: 'Admin', email: 'admin@grocerystore.com', password: hash }, { upsert: true }); console.log('Admin fixed'); process.exit(0); });"]
        env:
        - name: MONGODB_URI
          value: mongodb://mongo:27017/grocery-store
      containers:
      - name: backend
        image: kumaresan05/grocery-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: MONGODB_URI
          value: mongodb://mongo:27017/grocery-store
        - name: PORT
          value: "3000"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30001
